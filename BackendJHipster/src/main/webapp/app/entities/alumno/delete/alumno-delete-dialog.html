@if (alumno) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(alumno.id)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="alumnoDeleteDialogHeading" jhiTranslate="entity.delete.title">Confirmar operación de borrado</h4>
    </div>

    <div class="modal-body">
      <jhi-alert-error />
      <p id="jhi-delete-alumno-heading" jhiTranslate="ejemplo01App.alumno.delete.question" [translateValues]="{ id: alumno.id }">
        ¿Seguro que quiere eliminar Alumno {{ alumno.id }}?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Cancelar</span>
      </button>

      <button id="jhi-confirm-delete-alumno" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span jhiTranslate="entity.action.delete">Eliminar</span>
      </button>
    </div>
  </form>
}
