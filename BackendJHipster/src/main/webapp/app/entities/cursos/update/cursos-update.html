<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2 id="jhi-cursos-heading" data-cy="CursosCreateUpdateHeading" jhiTranslate="ejemplo01App.cursos.home.createOrEditLabel">
        Crear o editar Cursos
      </h2>

      <div>
        <jhi-alert-error />

        @if (editForm.controls.id.value !== null) {
          <div class="mb-3">
            <label class="form-label" for="field_id" jhiTranslate="global.field.id">ID</label>
            <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
          </div>
        }

        <div class="mb-3">
          <label class="form-label" for="field_curso" jhiTranslate="ejemplo01App.cursos.curso">Curso</label>
          <input type="text" class="form-control" name="curso" id="field_curso" data-cy="curso" formControlName="curso" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_usuarioCreacion" jhiTranslate="ejemplo01App.cursos.usuarioCreacion">Usuario Creacion</label>
          <input
            type="text"
            class="form-control"
            name="usuarioCreacion"
            id="field_usuarioCreacion"
            data-cy="usuarioCreacion"
            formControlName="usuarioCreacion"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_fechaCreacion" jhiTranslate="ejemplo01App.cursos.fechaCreacion">Fecha Creacion</label>
          <div class="d-flex">
            <input
              id="field_fechaCreacion"
              data-cy="fechaCreacion"
              type="datetime-local"
              class="form-control"
              name="fechaCreacion"
              formControlName="fechaCreacion"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_usuairoModificacion" jhiTranslate="ejemplo01App.cursos.usuairoModificacion"
            >Usuairo Modificacion</label
          >
          <input
            type="text"
            class="form-control"
            name="usuairoModificacion"
            id="field_usuairoModificacion"
            data-cy="usuairoModificacion"
            formControlName="usuairoModificacion"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_fechaModificacion" jhiTranslate="ejemplo01App.cursos.fechaModificacion"
            >Fecha Modificacion</label
          >
          <div class="d-flex">
            <input
              id="field_fechaModificacion"
              data-cy="fechaModificacion"
              type="datetime-local"
              class="form-control"
              name="fechaModificacion"
              formControlName="fechaModificacion"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Cancelar</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving()"
          class="btn btn-primary"
        >
          <fa-icon icon="save" />&nbsp;<span jhiTranslate="entity.action.save">Guardar</span>
        </button>
      </div>
    </form>
  </div>
</div>
